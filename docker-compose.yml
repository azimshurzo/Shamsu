version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    container_name: shamsu-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: shamsu
      POSTGRES_PASSWORD: shamsu_dev_2024
      POSTGRES_DB: shamsu
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shamsu -d shamsu"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
